[package]
name = "cds-anlz-rs"
version = "0.1.0"
edition = "2021"
authors = ["CJ Chanhnourack <cj@centennial.dev>"]
license = "MIT"
description = "Read-only Pioneer rekordbox ANLZ device-export walker extracted from Archivist Sort."
readme = "README.md"
repository = "https://github.com/centennial-defense-systems/cds-rekordbox-rs"
keywords = ["rekordbox", "anlz", "dj", "metadata"]
categories = ["multimedia::audio", "parser-implementations"]

[lib]
name = "cds_anlz_rs"
path = "src/lib.rs"

[dependencies]
binrw = "0.14"
cds-audio-metadata-rs = { path = "../cds-audio-metadata-rs" }
rekordcrate = { version = "0.3", default-features = false }
thiserror = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
