[package]
name = "cds-audio-metadata-rs"
version = "0.1.0"
edition = "2021"
authors = ["CJ Chanhnourack <cj@centennial.dev>"]
license = "MIT"
description = "Read-only audio metadata extraction primitives extracted from Archivist Sort."
readme = "README.md"
repository = "https://github.com/centennial-defense-systems/cds-rekordbox-rs"
keywords = ["audio", "metadata", "id3", "rekordbox"]
categories = ["multimedia::audio"]

[lib]
name = "cds_audio_metadata_rs"
path = "src/lib.rs"

[dependencies]
lofty = "0.24"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
